name: 每日备份
on:
  schedule:
    - cron: '23 19 * * *'       # 北京 03:23
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backup
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 整库快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/backup.py
      - name: 记录备份日志
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backups/log.json
          git diff --cached --quiet || git commit -q -m "备份 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git pull -q --rebase && git push -q
