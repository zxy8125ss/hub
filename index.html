<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-title" content="总控台">

<style>
/* 布局：顶部总判断 + 三块「运行 / 版本 / 备份」切换卡；下方按所选那块列出全部 App */
:root{
  --bg:#F2EADF; --card:#FBF6EE; --sand:#E7DCCB; --ink:#29473A; --brown:#7A5233; --teal:#2A9D8F;
  --muted:#7d7466; --line:#e0d4c1; --track:#e3d8c6;
  --ok:#2E7D5B; --okbg:#DCEBDF; --warn:#A8690F; --warnbg:#F6E5C6; --bad:#B3402E; --badbg:#F5D7CF; --idle:#8f8574; --idlebg:#E9E1D4;
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B231F; --card:#232E28; --sand:#2C3832; --ink:#ECE3D5; --brown:#D7AE84; --teal:#5FC4B7;
  --muted:#a69d8f; --line:#35423b; --track:#34413a;
  --ok:#7CC89E; --okbg:#21402F; --warn:#E6B45F; --warnbg:#45381F; --bad:#F2907C; --badbg:#4B2A24; --idle:#9a9184; --idlebg:#2E3732; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;position:relative;overflow-x:clip}
.blob{position:absolute;z-index:0;pointer-events:none;opacity:.55;top:-50px;right:-40px;width:200px}
.wrap>*:not(.blob){position:relative;z-index:1}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}

header{padding:20px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:600 25px/1.2 var(--serif);margin:0;letter-spacing:.03em}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
#refresh{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:600;display:flex;gap:8px;align-items:center;flex:none}
#refresh svg{width:15px;height:15px}
#refresh.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#refresh.busy svg{animation:none}}

/* 总判断 */
.hero{background:var(--card);border-radius:28px;padding:18px;border:1px solid var(--line);display:grid;gap:14px}
.verdict{display:flex;gap:12px;align-items:flex-start}
.verdict .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:8px;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 18%,transparent);background:currentColor}
.verdict b{font:600 19px/1.4 var(--serif);display:block}
.verdict ul{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:2px}
.verdict.ok{color:var(--ok)} .verdict.warn{color:var(--warn)} .verdict.bad{color:var(--bad)} .verdict.idle{color:var(--idle)}
.verdict ul li{color:var(--ink);opacity:.8}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pillar{border:2px solid transparent;background:var(--sand);border-radius:20px;padding:10px 12px;text-align:left;min-width:0;display:grid;gap:2px}
.pillar[aria-pressed="true"]{background:var(--card);border-color:var(--ink)}
.pillar .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pillar .k i{width:8px;height:8px;border-radius:50%;flex:none}
.pillar b{font:600 20px/1.2 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillar span{font-size:11.5px;color:var(--muted);line-height:1.45}
.pillar span em{font-style:normal;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-ok{background:var(--ok)} .c-warn{background:var(--warn)} .c-bad{background:var(--bad)} .c-idle{background:var(--idle)}

.note{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:10px 14px;font-size:13px;margin-top:12px}

section{margin-top:22px}
h2{font:600 16px/1.3 var(--serif);margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2 small{font:12px var(--sans);color:var(--muted);white-space:nowrap}
.panel{background:var(--card);border-radius:24px;padding:16px 18px;border:1px solid var(--line)}
.panel p{margin:0;font-size:13.5px}
.panel p+p{margin-top:6px}
.panel .muted{color:var(--muted);font-size:12.5px}
.btnlink{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;margin-top:10px}

/* 时间轴 */
.axis{position:relative;height:46px}
.axis .bar{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:6px;background:var(--track)}
.axis .night{position:absolute;top:20px;height:6px;background:color-mix(in srgb,var(--ink) 14%,transparent);border-radius:6px}
.axis .tick{position:absolute;top:32px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.axis .ev{position:absolute;top:14px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--card);background:var(--teal)}
.axis .now{position:absolute;top:6px;left:0;width:2px;height:34px;background:var(--brown);border-radius:2px}
.axis .now::after{content:"现在";position:absolute;top:-12px;left:0;font-size:10px;color:var(--brown);white-space:nowrap}
.upcoming{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.upcoming li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;font-size:13.5px;align-items:baseline}
.upcoming .t{font-family:var(--mono);font-size:12.5px;font-weight:600}
.upcoming .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upcoming .w span{color:var(--muted)}
.upcoming .in{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* App 卡片 */
.list{display:grid;gap:12px}
.app{background:var(--card);border-radius:24px;border:1px solid var(--line);overflow:hidden}
.app.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.app.bad .head{background:linear-gradient(90deg,var(--badbg),transparent 70%)}
.app.warn .head{background:linear-gradient(90deg,var(--warnbg),transparent 70%)}
.head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px 10px;width:100%;border:0;background:none;text-align:left}
.icon{width:44px;height:44px;border-radius:13px;background:var(--sand);display:flex;align-items:center;justify-content:center;font:600 17px var(--serif);color:var(--brown);overflow:hidden;position:relative}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.title{min-width:0}
.title b{font:600 16.5px/1.3 var(--serif);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.idle{background:var(--idlebg);color:var(--idle)}
.ver{font-family:var(--mono);font-size:13px;font-weight:600;background:var(--sand);border-radius:8px;padding:3px 8px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.body{padding:0 16px 14px;display:grid;gap:10px}
.alert{font-size:13px;font-weight:600;color:var(--bad)}
.alert.w{color:var(--warn)}
.strip{display:flex;gap:2px;height:22px;align-items:flex-end}
.strip i{flex:1;max-width:9px;border-radius:3px}
.strip i.s{height:100%} .strip i.p{height:55%}
.strip i.ok{background:var(--ok)} .strip i.bad{background:var(--bad)} .strip i.run{background:var(--warn)} .strip i.cx{background:var(--idle);opacity:.5}
.striplabel{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:-6px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv span{font-size:11px;color:var(--muted);display:block;white-space:nowrap}
@media (max-width:420px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.box{background:var(--sand);border-radius:16px;padding:10px 12px;font-size:13px;display:grid;gap:4px;min-width:0}
.box .lab{font-size:11px;color:var(--brown);font-weight:600;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.box .lab em{font-style:normal;font-weight:400;color:var(--muted);letter-spacing:0}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.day{background:var(--card);border-radius:10px;padding:4px 7px;font-size:11px;text-align:center;line-height:1.35}
.day b{display:block;font-size:11.5px}
.y{color:var(--ok)} .n{color:var(--muted)}
.ups{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ups li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:13px}
.ups .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.ups .m{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}
.dl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dl a{font-weight:600;text-decoration:none;white-space:nowrap}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.local{background:var(--warnbg);color:var(--warn)} .chip.cloud{background:var(--okbg);color:var(--ok)} .chip.none,.chip.minor,.chip.unknown{background:var(--idlebg);color:var(--idle)}
.hist{display:flex;gap:3px;align-items:flex-end;height:18px}
.hist i{width:8px;border-radius:2px;background:var(--teal);opacity:.75}
.hist i.same{opacity:.3}

.toggle{border:0;background:none;color:var(--muted);font-size:12.5px;padding:0;display:flex;gap:4px;align-items:center;justify-self:start}
.chev{transition:transform .2s}
.app[data-open="1"] .chev{transform:rotate(180deg)}
.detail{border-top:1px dashed var(--line);padding:12px 16px 16px;display:grid;gap:14px}
.wf h3{font:600 14px/1.3 var(--sans);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wf h3 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.wf h3 small{font-weight:400;color:var(--muted);font-size:12px}
.runs{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.runs li{display:grid;grid-template-columns:82px 40px minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:baseline}
.runs .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.runs .ev{color:var(--muted)}
.runs .rs{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.runs .rs.bad{color:var(--bad);font-weight:600} .runs .rs.ok{color:var(--ok)}
.runs .du{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.why{font-size:12.5px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.links a{text-decoration:none;font-weight:600}
footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
.dir{list-style:none;margin:0;padding:0;display:grid}
.dir li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.dir li:first-child{border-top:0;padding-top:0}
.dir .ic{width:32px;height:32px;border-radius:9px;background:var(--sand);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);color:var(--brown)}
.dir .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dir .nm{min-width:0}
.dir .nm a{font-weight:600;text-decoration:none;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir .nm span{font-family:var(--mono);font-size:11.5px;color:var(--teal);display:block;word-break:break-all;user-select:all;-webkit-user-select:all}
.dir button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;white-space:nowrap}
.dir button.done{background:var(--okbg);color:var(--ok);border-color:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recs li{display:grid;gap:2px;min-width:0}
.recs .rt{font-size:12px;color:var(--muted);display:flex;gap:6px;min-width:0}
.recs .rt b{color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recs .rx{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.recs.clamp .rx{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recday{font:600 13px var(--serif);color:var(--brown);margin-top:6px}
.result{font-size:13px;display:grid;gap:2px;margin-top:8px}
.result .bad{color:var(--bad)}
input[type=search]{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px}
.skeleton{height:140px;border-radius:24px;background:var(--sand);opacity:.6}
</style>
</head>

  <header>

<script>
const BUILD = '2026-10-18-1800';
(async () => {   // 自动更新：线上有新版本就刷新一次
  try {
    const v = (await (await fetch('version.json?t=' + Date.now(), {cache:'no-store'})).json()).build;
    if (v && v !== BUILD && sessionStorage.getItem('hub-reloaded') !== v) { sessionStorage.setItem('hub-reloaded', v); location.replace(location.pathname + '?v=' + v); }
  } catch (e) {}
})();

const OWNER = 'zxy8125ss';
const STATUS_URL = `https://raw.githubusercontent.com/${OWNER}/hub/status/status.json`;
const DEFAULT_GAP = 27;
const BAD = ['failure','timed_out','startup_failure','action_required'];
const IGNORE = ['cancelled','skipped','neutral','stale'];
const JOBNAME = {'pages build and deployment':'更新网页','Deploy to gh-pages':'更新网页','部署':'更新网页','部署到 GitHub Pages':'更新网页','Deploy to GitHub Pages':'更新网页','pages':'更新网页'};
const EVENT = {schedule:'定时',push:'提交',workflow_dispatch:'手动',issues:'App提交',dynamic:'更新网页',workflow_run:'联动',repository_dispatch:'触发'};
const RANK = {bad:0,warn:1,ok:2,idle:3};
const VIEWS = {run:'运行正常', ver:'版本更新', bak:'最近备份', rec:'我的记录'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const BJ = 8*3600e3;
const bjDate = t => new Date(new Date(t).getTime() + BJ).toISOString().slice(0,10);
function ago(t){
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  if (m < 1) return '刚刚'; if (m < 60) return m + ' 分钟前';
  const h = Math.round(m / 60); if (h < 48) return h + ' 小时前';
  return Math.round(h / 24) + ' 天前';
}
function until(t){
  const m = Math.round((new Date(t) - Date.now()) / 60000);
  if (m < 60) return m + ' 分钟后'; const h = Math.floor(m / 60);
  return h + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分钟' : '') + '后';
}
const fmt = (t, o) => new Date(t).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false, ...o});
const clock = t => fmt(t, {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
const hm = t => fmt(t, {hour:'2-digit', minute:'2-digit'});
const md = t => fmt(t, {month:'numeric', day:'numeric'});
const dur = s => s == null ? '—' : s < 60 ? Math.round(s) + ' 秒' : (s / 60).toFixed(s < 600 ? 1 : 0) + ' 分钟';
const size = b => b == null ? '—' : b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const isDeploy = r => JOBNAME[r.name] === '更新网页' || /deploy|pages/i.test(r.path || '');

/* ---------- cron（UTC） ---------- */
function field(f, lo, hi){
  const set = new Set();
  for (const part of f.split(',')) {
    let [rng, step] = part.split('/'); step = +step || 1;
    let a = lo, b = hi;
    if (rng !== '*') { const [x, y] = rng.split('-'); a = +x; b = y != null ? +y : (part.includes('/') ? hi : +x); }
    for (let v = a; v <= b; v += step) set.add(v === 7 && hi === 6 ? 0 : v);
  }
  return set;
}
function parseCron(expr){
  const p = expr.trim().split(/\s+/); if (p.length !== 5) return null;
  return {mi:field(p[0],0,59), h:field(p[1],0,23), d:field(p[2],1,31), mo:field(p[3],1,12), w:field(p[4],0,6), dAny:p[2]==='*', wAny:p[4]==='*'};
}
function nextFires(c, from, to){
  const out = []; const t = new Date(Math.ceil(from / 60000) * 60000);
  for (let i = 0; i < 2000 && t <= to; i++) {
    const dOk = c.dAny && c.wAny ? true : c.dAny ? c.w.has(t.getUTCDay()) : c.wAny ? c.d.has(t.getUTCDate()) : (c.d.has(t.getUTCDate()) || c.w.has(t.getUTCDay()));
    if (!(c.mo.has(t.getUTCMonth()+1) && dOk)) { t.setUTCHours(24,0,0,0); continue; }
    if (!c.h.has(t.getUTCHours())) { t.setUTCHours(t.getUTCHours()+1,0,0,0); continue; }
    const mins = [...c.mi].sort((a, b) => a - b), m = mins.find(x => x >= t.getUTCMinutes());
    if (m == null) { t.setUTCHours(t.getUTCHours()+1,0,0,0); continue; }
    t.setUTCMinutes(m); if (t <= to) out.push(new Date(t));
    t.setUTCMinutes(m+1);
  }
  return out;
}

/* ---------- 读取 ---------- */
let rateLeft = null, rateReset = null;
async function gh(path){
  const r = await fetch('https://api.github.com' + path, {headers:{Accept:'application/vnd.github+json'}});
  if (r.headers.get('x-ratelimit-remaining') !== null) rateLeft = +r.headers.get('x-ratelimit-remaining');
  if (r.headers.get('x-ratelimit-reset')) rateReset = +r.headers.get('x-ratelimit-reset') * 1000;
  if (r.status === 403 || r.status === 429) { const e = new Error('rate'); e.rate = true; throw e; }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function probe(url, retry = true){
  const r1 = await probeOnce(url);
  if (r1.ok || !retry) return r1;
  await new Promise(r => setTimeout(r, 1500));
  return probeOnce(url);
}
async function probeOnce(url){
  const t0 = performance.now();
  try {
    const r = await fetch(url, {cache:'no-store'});
    const ms = Math.round(performance.now() - t0);
    let icon = null;
    if (r.ok) {
      const html = await r.text();
      const m = html.match(/rel=["']apple-touch-icon["'][^>]*href=["']([^"']+)["']/i) || html.match(/href=["']([^"']+)["'][^>]*rel=["']apple-touch-icon["']/i);
      if (m) icon = new URL(m[1], url).href;
    }
    return {ok:r.ok, code:r.status, ms, icon};
  } catch (e) { return {ok:false, code:0, ms:null, icon:null}; }
}
const getJSON = async u => { const r = await fetch(u + '?t=' + Date.now()); if (!r.ok) throw 0; return r.json(); };

/* 各 App 自己的数据是否按时更新 */
const ADAPTERS = {
  async gameon(url){
    const s = await getJSON(url + 'data/schedule.json');
    const lines = [], warn = [];
    const m = (s.note || '').match(/(\d+)\s*\/\s*(\d+)/);
    if (m && +m[1] < +m[2]) warn.push(`${+m[2] - +m[1]} 个赛程数据源这次没取到`);
    const now = Date.now(), week = now + 7 * 864e5;
    const t = x => x.bj ? new Date(x.bj.replace(' ', 'T') + ':00+08:00').getTime() : x.date ? new Date(x.date + 'T12:00:00+08:00').getTime() : NaN;
    const up = (s.matches || []).filter(x => !x.result && t(x) > now - 2 * 3600e3).sort((a, b) => t(a) - t(b));
    lines.push(`赛程更新于 ${ago(s.updatedAt)} · ${esc(s.note || '')}`);
    lines.push(`未来 7 天 ${up.filter(x => t(x) < week).length} 场${up[0] ? ` · 下一场 ${esc(up[0].title)}` : ''}`);
    if (now - new Date(s.updatedAt) > 14 * 3600e3) warn.push('赛程超过 14 小时没更新');
    return {lines, warn};
  },
  async radar(url){
    const r = await getJSON(url + 'data/runs.json');
    const log = [...(r.log || [])].sort((a, b) => a.date < b.date ? 1 : -1), last = log[0] || {};
    const today = bjDate(Date.now()), lines = [], warn = [];
    lines.push(`最近一次每日更新 ${esc(r.last_daily)}${last.added != null ? ` · 新增 ${last.added} 条` : ''}`);
    lines.push(`最近 ${Math.min(7, log.length)} 次更新成功 ${log.slice(0, 7).filter(x => x.ok).length} 次`);
    if (last.ok === false) warn.push('最近一次每日更新没有成功');
    if (last.date === today && last.added != null && last.added < 10) warn.push(`今天只找到 ${last.added} 条，没达到每天 10 条`);
    if (r.last_daily !== today && new Date(Date.now() + BJ).getUTCHours() >= 12) warn.push('今天的每日信息还没更新');
    return {lines, warn};
  },
  async fund(url){
    const d = await getJSON(url + 'data/index.json');
    const days = Object.keys(d.days || {}).sort().slice(-5);
    const mark = (v, y, n) => `<span class="${v ? 'y' : 'n'}">${v ? y : n}</span>`;
    const html = days.map(k => { const x = d.days[k];
      return `<div class="day"><b>${k.slice(5).replace('-', '/')}</b>${mark(x.result, '已结算', '未结算')}<br>${mark(x.review, '已复盘', '未复盘')}</div>`; }).join('');
    const warn = [], missing = days.filter(k => k < bjDate(Date.now()) && !d.days[k].result);
    if (missing.length) warn.push(`${missing.map(k => k.slice(5)).join('、')} 还没结算`);
    return {lines:[`最近 ${days.length} 个交易日的结算与复盘`, `<div class="days">${html}</div>`], warn};
  }
};

/* ---------- 判断 ---------- */
function judgeRun(a){
  const byWf = new Map();
  for (const run of a.runs || []) {
    if (!byWf.has(run.wid)) byWf.set(run.wid, {name: JOBNAME[run.name] || run.name, path: run.path, runs: []});
    byWf.get(run.wid).runs.push(run);
  }
  const wfs = [];
  for (const wf of byWf.values()) {
    const latest = wf.runs[0];
    const done = wf.runs.find(r => r.status === 'completed' && !IGNORE.includes(r.conclusion));
    const sched = wf.runs.find(r => r.event === 'schedule');
    const crons = (a.crons || {})[wf.path] || [];
    let state = 'ok', why = '';
    if (done && BAD.includes(done.conclusion)) {
      state = 'bad'; let n = 0;
      for (const r of wf.runs.filter(r => r.status === 'completed' && !IGNORE.includes(r.conclusion))) { if (BAD.includes(r.conclusion)) n++; else break; }
      why = n > 1 ? `连续失败 ${n} 次` : '最近一次运行失败';
    }
    if (sched && state !== 'bad' && crons.length) {
      const gap = (a.maxGap && a.maxGap[wf.name]) || DEFAULT_GAP;
      const hrs = (Date.now() - new Date(sched.created_at)) / 3600e3;
      if (hrs > gap) { state = 'warn'; why = `定时任务 ${Math.floor(hrs)} 小时没跑了`; }
    }
    if (latest && latest.status !== 'completed' && state === 'ok') why = '正在运行';
    const fin = wf.runs.filter(r => r.status === 'completed' && !IGNORE.includes(r.conclusion) && Date.now() - new Date(r.created_at) < 7 * 864e5);
    const durs = wf.runs.filter(r => r.status === 'completed' && r.started).map(r => (new Date(r.updated_at) - new Date(r.started)) / 1000).filter(x => x >= 0 && x < 7200).slice(0, 10);
    const next = crons.map(parseCron).filter(Boolean).flatMap(c => nextFires(c, Date.now(), Date.now() + 8 * 864e5)).sort((x, y) => x - y);
    wfs.push({name: wf.name, state, why, failRun: state === 'bad' ? done : null, scheduled: crons.length > 0,
      next: next[0] || null, nextList: next.filter(t => t - Date.now() < 864e5),
      week: fin.length, weekOk: fin.filter(r => !BAD.includes(r.conclusion)).length,
      avg: durs.length ? durs.reduce((x, y) => x + y, 0) / durs.length : null, runs: wf.runs.slice(0, 8)});
  }
  wfs.sort((x, y) => RANK[x.state] - RANK[y.state] || y.scheduled - x.scheduled);
  let state = wfs.reduce((s, w) => RANK[w.state] < RANK[s] ? w.state : s, wfs.length ? 'ok' : 'idle');
  const alerts = wfs.filter(w => w.why && w.state !== 'ok').map(w => ({level: w.state, text: `${w.name}：${w.why}`}));
  // 网页能否打开：手机和服务器都打不开才算故障；只有一边打不开记为留意
  const ph = a.probe, sv = a.site;
  if (sv && !sv.ok && (!ph || !ph.ok)) { state = 'bad'; alerts.unshift({level:'bad', text:`网页打不开（${sv.code || '无响应'}）`}); }
  else if (ph && !ph.ok) { if (RANK[state] > 1) state = 'warn'; alerts.unshift({level:'warn', text:'这次你这儿没打开网页，自动检查时是正常的'}); }
  else if (sv && !sv.ok) { if (RANK[state] > 1) state = 'warn'; alerts.unshift({level:'warn', text:'自动检查时没打开网页，你这儿是正常的'}); }
  for (const w of (a.content && a.content.warn) || []) { alerts.push({level:'warn', text:w}); if (RANK[state] > 1) state = 'warn'; }
  if (a.runs == null) { alerts.push({level:'warn', text:'没读到任务记录'}); if (RANK[state] > 1) state = 'warn'; }
  const recent = (a.runs || []).filter(r => Date.now() - new Date(r.created_at) < 14 * 864e5);
  const fin = recent.filter(r => r.status === 'completed' && !IGNORE.includes(r.conclusion) && Date.now() - new Date(r.created_at) < 7 * 864e5);
  return {state, alerts, wfs,
    strip: recent.slice(0, 40).reverse().map(r => ({c: r.status !== 'completed' ? 'run' : BAD.includes(r.conclusion) ? 'bad' : IGNORE.includes(r.conclusion) ? 'cx' : 'ok', s: r.event === 'schedule', t: r.created_at, n: JOBNAME[r.name] || r.name})),
    week: fin.length, weekOk: fin.filter(r => !BAD.includes(r.conclusion)).length,
    today: (a.runs || []).filter(r => bjDate(r.created_at) === bjDate(Date.now())).length,
    todayFail: (a.runs || []).filter(r => bjDate(r.created_at) === bjDate(Date.now()) && BAD.includes(r.conclusion)).length,
    auto: wfs.some(w => w.scheduled), next: wfs.map(w => w.next).filter(Boolean).sort((x, y) => x - y)[0] || null};
}

function judgeVer(a){
  const head = a.deployIgnoreBot ? a.headHuman : a.head;
  const deploys = (a.runs || []).filter(isDeploy);
  const last = deploys[0], ok = deploys.find(r => r.status === 'completed' && r.conclusion === 'success');
  // 版本号统一成短写法：语义版本显示 v1.3.1；日期型（构建号或没标版本的）显示「10.18 版」
  const raw = a.version && a.version.label;
  const dm = raw && raw.match(/^\d{4}[-.](\d{2})[-.](\d{2})/);
  const label = raw ? (dm ? `${+dm[1]}.${dm[2]} 版` : (/^\d/.test(raw) ? 'v' + raw : raw)) : (a.headHuman ? md(a.headHuman.date).replace('/', '.') + ' 版' : '—');
  const labelNote = a.version && a.version.label ? a.version.source : '没有标版本号，按最近一次功能更新的日期显示';
  let state = 'ok', text = '网页已是最新版';
  if (!last) { state = 'idle'; text = '没有更新网页的记录'; }
  else if (last.status !== 'completed') { const long = Date.now() - new Date(last.created_at) > 30 * 60000; state = long ? 'warn' : 'ok'; text = long ? `更新网页已经卡了 ${ago(last.created_at).replace('前', '')}` : '正在更新网页'; }
  else if (BAD.includes(last.conclusion)) { state = 'bad'; text = '最近一次更新网页失败，网页还是旧版'; }
  else if (head && new Date(last.created_at) < new Date(head.date) - 60e3) {
    const mins = (Date.now() - new Date(head.date)) / 60000;
    state = mins > 30 ? 'warn' : 'ok'; text = mins > 30 ? `${ago(head.date)}改的内容还没更新到网页` : '刚改的内容正在更新到网页';
  }
  return {state, text, label, labelNote, deployedAt: ok ? ok.updated_at : null, updates: a.updates || [], autoWeek: a.autoWeek || 0, humanWeek: a.humanWeek || 0};
}

function judgeBak(a){
  const b = a.backup && a.backup.latest;
  let state = 'ok', text;
  if (!b) { state = 'warn'; text = '还没有自动备份'; }
  else if (b.error) { state = 'bad'; text = '最近一次自动备份失败'; }
  else if (Date.now() - new Date(b.at) > 36 * 3600e3) { state = 'warn'; text = `上次备份在 ${ago(b.at)}，每日备份可能没跑`; }
  else text = `${md(b.at)} ${hm(b.at)} 已备份`;
  const hist = (a.backup && a.backup.history) || [];
  return {state, text, latest: b, hist, changed: hist.length > 1 ? hist[0].sha !== hist[1].sha : null};
}

/* ---------- 流程 ---------- */
let data = null, view = store.get('hub-view') || 'run', openSet = new Set(), fetchedAt = null, liveAt = null;
async function load(live){
  const btn = $('#refresh'); btn.disabled = true; btn.classList.add('busy');
  const note = $('#note'); note.hidden = true;
  try {
    const st = await getJSON(STATUS_URL);
    fetchedAt = Date.now();
    const apps = st.apps;
    const extra = apps.map(async a => {
      const ad = ADAPTERS[a.adapter];
      const [p, c] = await Promise.all([probe(a.url), ad ? ad(a.url).catch(() => ({lines:[], warn:['没读到这个 App 的数据文件']})) : null]);
      a.probe = p; a.content = c;
    });
    if (live) {
      try {
        await Promise.all(apps.map(async a => { const d = await gh(`/repos/${OWNER}/${a.repo}/actions/runs?per_page=50`);
          a.runs = (d.workflow_runs || []).map(r => ({id:r.id, wid:r.workflow_id, name:r.name, path:r.path, event:r.event, status:r.status, conclusion:r.conclusion,
            created_at:r.created_at, started:r.run_started_at, updated_at:r.updated_at, url:r.html_url, sha:r.head_sha, msg:(r.head_commit && r.head_commit.message || '').split('\n')[0]})); }));
        liveAt = Date.now();
      } catch (e) {
        note.hidden = false;
        note.textContent = e.rate ? `这小时的核对次数用完了（约 ${rateReset ? Math.max(1, Math.ceil((rateReset - Date.now()) / 60000)) : 60} 分钟后恢复），下面是 ${ago(st.generated_at)}自动检查的结果。` : '核对时没连上 GitHub，下面是最近一次自动检查的结果。';
      }
    }
    await Promise.all(extra);
    data = st;
    store.set('hub-last', {at: Date.now(), st});
    if (Date.now() - new Date(st.generated_at) > 90 * 60000) { note.hidden = false; note.textContent = `自动检查已经 ${ago(st.generated_at)}没更新了，总控台自己的检查任务可能停了。`; }
    render();
  } catch (e) {
    note.hidden = false; note.textContent = '读取状态失败，检查一下网络。下面是上次的结果。';
  } finally { btn.disabled = false; btn.classList.remove('busy'); }
}

/* ---------- 渲染 ---------- */
function render(){
  if (!data) return;
  const apps = data.apps.map(a => ({...a, R: judgeRun(a), V: judgeVer(a), B: judgeBak(a)}));
  const issues = [];
  for (const a of apps) {
    for (const x of a.R.alerts) issues.push({level:x.level, text:`${a.title}：${x.text}`});
    if (a.V.state === 'bad' || a.V.state === 'warn') issues.push({level:a.V.state, text:`${a.title}：${a.V.text}`});
    if (a.B.state === 'bad' || (a.B.state === 'warn' && data.backup)) issues.push({level:a.B.state, text:`${a.title}：${a.B.text}`});
  }
  if (!data.backup) issues.push({level:'warn', text:'自动备份还没跑过第一次'});
  issues.sort((x, y) => RANK[x.level] - RANK[y.level]);
  const top = issues.length ? issues[0].level : 'ok';
  const v = $('#verdict'); v.className = 'verdict ' + top;
  v.innerHTML = issues.length
    ? `<span class="dot"></span><div><b>${issues.filter(i => i.level === 'bad').length ? issues.filter(i => i.level === 'bad').length + ' 个问题要处理' : issues.length + ' 处需要留意'}</b><ul>${issues.slice(0, 4).map(i => `<li>${esc(i.text)}</li>`).join('')}${issues.length > 4 ? `<li>另有 ${issues.length - 4} 处</li>` : ''}</ul></div>`
    : `<span class="dot"></span><div><b>${apps.length} 个 App 全部正常</b><ul><li>任务按时跑完，网页都是最新版，今天已备份</li></ul></div>`;

  const worst = k => apps.reduce((s, a) => RANK[a[k].state] < RANK[s] ? a[k].state : s, 'ok');
  const runOk = apps.filter(a => RANK[a.R.state] >= 2).length;
  const today = apps.reduce((s, a) => s + a.R.today, 0), fails = apps.reduce((s, a) => s + a.R.todayFail, 0);
  const updated = apps.filter(a => a.V.humanWeek > 0).length, pending = apps.filter(a => a.V.state !== 'ok' && a.V.state !== 'idle').length;
  const bk = data.backup;
  const P = {
    run: {dot: worst('R'), big: `${runOk}/${apps.length}`, sub: [`今天失败 ${fails} 次`, !fails ? '任务都跑成功了' : apps.some(a => a.R.state === 'bad') ? '还有没恢复的' : '都已恢复']},
    ver: {dot: worst('V'), big: `${updated} 个`, sub: ['本周有功能更新', pending ? `${pending} 个网页没更新` : '网页都是最新版']},
    bak: {dot: bk ? worst('B') : 'warn', big: bk ? md(bk.at) : '未备份', sub: bk ? [`${bk.count} 个 App`, size(bk.total_bytes)] : ['每天 03:23', '自动备份']}
  };
  P.rec = {dot: recState.total ? 'ok' : 'idle', big: recState.total ? `${recState.total} 条` : '未导入', sub: recState.total ? [`${recState.apps} 个 App`, `最近导入 ${md(recState.last)}`] : ['导入各 App 的', '备份后可查看']};
  $('#pillars').innerHTML = Object.keys(VIEWS).map(k => `<button class="pillar" type="button" role="tab" data-view="${k}" aria-pressed="${k === view}"><span class="k"><i class="c-${P[k].dot}"></i>${VIEWS[k]}</span><b>${P[k].big}</b><span>${P[k].sub.map(x => `<em>${esc(x)}</em>`).join('')}</span></button>`).join('');

  renderDir(apps);
  if (view === 'rec') { $('#view').innerHTML = recShell(); renderRec(apps); }
  else $('#view').innerHTML = view === 'run' ? viewRun(apps) : view === 'ver' ? viewVer(apps) : viewBak(apps);
  $('#when').textContent = `自动检查于 ${clock(data.generated_at)}（${ago(data.generated_at)}）${liveAt ? ' · 刚刚又核对过' : ''}`;
  $('#foot').innerHTML = `每 30 分钟自动检查一次，每天 03:23 自动备份<br>新做的 App 发布成网页后，会自动出现在这里`;
  try { if (navigator.setAppBadge) { const n = issues.filter(i => i.level === 'bad').length; n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) {}
}

const head = (a, right) => `<button class="head" type="button" data-toggle="${esc(a.repo)}" aria-expanded="${openSet.has(a.repo)}">
  <span class="icon">${esc(a.title.slice(0, 1))}${a.probe && a.probe.icon ? `<img src="${esc(a.probe.icon)}" alt="" onerror="this.remove()">` : ''}</span>
  <span class="title"><b>${esc(a.title)}</b><span>${esc(a.desc)}</span></span>${right}</button>`;
const toggle = a => `<button class="toggle" type="button" data-toggle="${esc(a.repo)}">${openSet.has(a.repo) ? '收起' : '展开详情'} <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>`;
const LABEL = {bad:'失败', warn:'留意', ok:'正常', idle:'无任务'};
const sortBy = k => (x, y) => RANK[x[k].state] - RANK[y[k].state] || (y.R.auto - x.R.auto) || new Date(y.pushed_at) - new Date(x.pushed_at);

/* 运行 */
function viewRun(apps){
  const now = Date.now(), end = now + 864e5;
  // 每天超过 12 次的高频任务（如总控台自己的状态检查）不上时间轴，单独注明
  const frequent = apps.flatMap(a => a.R.wfs.filter(w => w.nextList.length > 12).map(w => `${a.title}「${w.name}」`));
  const evs = apps.flatMap(a => a.R.wfs.filter(w => w.nextList.length <= 12).flatMap(w => w.nextList.map(t => ({t: new Date(t).getTime(), a, w})))).filter(e => e.t > now && e.t < end).sort((x, y) => x.t - y.t);
  const pos = t => ((t - now) / 864e5 * 100).toFixed(2) + '%';
  const nights = []; const d0 = new Date(now + BJ); d0.setUTCHours(0, 0, 0, 0);
  for (let k = 0; k < 2; k++) { const s = d0.getTime() - BJ + k * 864e5, e = s + 7 * 3600e3, x = Math.max(s, now), y = Math.min(e, end);
    if (y > x) nights.push(`<div class="night" style="left:${pos(x)};width:${((y - x) / 864e5 * 100).toFixed(2)}%"></div>`); }
  const ticks = []; for (let t = Math.ceil((now + BJ) / (6 * 3600e3)) * 6 * 3600e3 - BJ; t < end; t += 6 * 3600e3) ticks.push(`<span class="tick" style="left:${pos(t)}">${hm(t)}</span>`);
  const shown = evs.slice(0, 5);
  const tl = evs.length ? `<div class="axis"><div class="bar"></div>${nights.join('')}${ticks.join('')}<span class="now"></span>${evs.map(e => `<span class="ev" style="left:${pos(e.t)}"></span>`).join('')}</div>
    <ul class="upcoming">${shown.map(e => `<li><span class="t">${hm(e.t)}</span><span class="w">${esc(e.a.title)} <span>· ${esc(e.w.name)}</span></span><span class="in">${until(e.t)}</span></li>`).join('')}</ul>
    ${evs.length > shown.length ? `<div class="empty">另有 ${evs.length - shown.length} 次</div>` : ''}` : '<div class="empty">接下来 24 小时没有定时任务</div>';
  const freqNote = frequent.length ? `<div class="empty">${esc(frequent.join('、'))}每 30 分钟跑一次，未列出</div>` : '';
  const cards = [...apps].sort(sortBy('R')).map(a => {
    const R = a.R, p = a.probe || a.site;
    const strip = R.strip.length ? `<div class="strip">${R.strip.map(x => `<i class="${x.c} ${x.s ? 's' : 'p'}" title="${esc(x.n)} ${clock(x.t)}"></i>`).join('')}</div>
      <div class="striplabel"><span>${md(R.strip[0].t)}</span><span>最近 ${R.strip.length} 次运行 · 高条为定时</span><span>现在</span></div>` : '';
    const content = a.content && a.content.lines.length ? `<div class="box"><span class="lab">App 数据</span>${a.content.lines.map(l => `<div>${l}</div>`).join('')}</div>` : '';
    return `<article class="app ${R.state}" data-open="${openSet.has(a.repo) ? 1 : 0}">${head(a, `<span class="pill ${R.state}">${LABEL[R.state]}</span>`)}
      <div class="body">${R.alerts.map(x => `<div class="alert ${x.level === 'bad' ? '' : 'w'}">${x.level === 'bad' ? '●' : '○'} ${esc(x.text)}</div>`).join('')}${strip}
        <div class="kv"><div><b>${R.week ? Math.round(R.weekOk / R.week * 100) + '%' : '—'}</b><span>7 天成功率</span></div>
          <div><b>${R.next ? hm(R.next) : (R.auto ? '—' : '无')}</b><span>下次定时</span></div>
          <div><b style="${p && !p.ok ? 'color:var(--bad)' : ''}">${p ? (p.ok ? (p.ms != null ? p.ms + ' 毫秒' : '正常') : '打不开') : '—'}</b><span>网页响应</span></div>
          <div><b>${ago(a.pushed_at)}</b><span>最后改动</span></div></div>
        ${content}${toggle(a)}</div>${openSet.has(a.repo) ? detailRun(a) : ''}</article>`;
  }).join('');
  return `<section><h2>接下来 24 小时<small>${evs.length ? `共 ${evs.length} 次定时任务` : ''}</small></h2><div class="panel">${tl}${freqNote}</div></section>
    <section><h2>各 App 运行情况<small>${apps.filter(a => (a.probe || a.site || {}).ok).length}/${apps.length} 个网页能打开</small></h2><div class="list">${cards}</div></section>`;
}
function detailRun(a){
  const wfs = a.R.wfs.map(w => {
    const meta = [w.week ? `7 天 ${w.weekOk}/${w.week} 次成功` : '', w.avg != null ? `平均 ${dur(w.avg)}` : '', w.nextList.length ? `24 小时内还会跑 ${w.nextList.length} 次` : ''].filter(Boolean).join(' · ');
    const why = w.failRun ? `<div class="why">${esc((a.failSteps || {})[w.failRun.id] || '点下面的「失败」看日志')}</div>` : '';
    return `<div class="wf"><h3><i class="c-${w.state}"></i>${esc(w.name)}<small>${esc(meta)}</small></h3>${why}<ul class="runs">${w.runs.map(r => {
      const c = r.status !== 'completed' ? '' : BAD.includes(r.conclusion) ? 'bad' : IGNORE.includes(r.conclusion) ? '' : 'ok';
      const res = r.status !== 'completed' ? '运行中' : BAD.includes(r.conclusion) ? '失败' : r.conclusion === 'cancelled' ? '已取消' : r.conclusion === 'skipped' ? '跳过' : '成功';
      const d = r.started && r.status === 'completed' ? (new Date(r.updated_at) - new Date(r.started)) / 1000 : null;
      return `<li><span class="tm">${clock(r.created_at)}</span><span class="ev">${EVENT[r.event] || esc(r.event)}</span><a class="rs ${c}" href="${esc(r.url)}" target="_blank" rel="noopener">${res}${r.event !== 'schedule' && r.msg ? ' · ' + esc(r.msg) : ''}</a><span class="du">${dur(d)}</span></li>`;
    }).join('')}</ul></div>`;
  }).join('');
  return `<div class="detail">${wfs || '<div class="empty">这个仓库没有自动任务</div>'}<div class="links"><a href="${esc(a.url)}" target="_blank" rel="noopener">打开 App</a><a href="https://github.com/${OWNER}/${esc(a.repo)}/actions" target="_blank" rel="noopener">GitHub 任务记录</a></div></div>`;
}

/* 版本 */
function viewVer(apps){
  const cards = [...apps].sort((x, y) => RANK[x.V.state] - RANK[y.V.state] || new Date((y.updates[0] || {}).date || 0) - new Date((x.updates[0] || {}).date || 0)).map(a => {
    const V = a.V, open = openSet.has(a.repo);
    const ups = V.updates.slice(0, open ? 5 : 3);
    return `<article class="app ${V.state === 'ok' || V.state === 'idle' ? '' : V.state}" data-open="${open ? 1 : 0}">${head(a, `<span class="ver" title="${esc(V.labelNote)}">${esc(V.label)}</span>`)}
      <div class="body">
        <div class="dl"><span class="${V.state === 'bad' ? 'alert' : V.state === 'warn' ? 'alert w' : ''}" style="font-size:13px">${V.state === 'ok' ? '<span class="y">●</span> ' : ''}${esc(V.text)}</span><span class="pill ${V.state}">${V.deployedAt ? '网页更新于 ' + clock(V.deployedAt) : '—'}</span></div>
        <div class="box"><span class="lab">最近的功能更新<em>${V.humanWeek ? `本周 ${V.humanWeek} 次` : '本周没有'}</em></span>
          ${ups.length ? `<ul class="ups">${ups.map(u => `<li><span class="d">${md(u.date)}</span><span class="m" title="${esc(u.msg)}">${esc(u.msg)}</span></li>`).join('')}</ul>` : '<div class="n">还没有功能更新记录</div>'}
          ${V.autoWeek ? `<div class="n" style="font-size:12px">另有数据自动更新：本周 ${V.autoWeek} 次</div>` : ''}</div>
        ${open ? `<div class="n" style="font-size:12px">版本号来源：${esc(V.labelNote)}</div><div class="links"><a href="${esc(a.url)}" target="_blank" rel="noopener">打开 App</a><a href="https://github.com/${OWNER}/${esc(a.repo)}/commits" target="_blank" rel="noopener">全部提交记录</a></div>` : ''}
        ${toggle(a)}</div></article>`;
  }).join('');
  return `<section><h2>各 App 版本<small>按最近更新排序</small></h2><div class="list">${cards}</div></section>`;
}

/* 备份 */
function viewBak(apps){
  const bk = data.backup;
  const intro = bk
    ? `<p><b>每日自动备份</b>：每天 03:23 把 ${bk.count} 个 App 的程序和存在 GitHub 上的数据各打一个压缩包，保留 ${bk.retention} 天（已有 ${bk.days} 天）。</p>
       <p class="muted">最近一次：${clock(bk.at)} · 共 ${size(bk.total_bytes)}。超过 2 MB 的大文件（如 Forge 的音乐）不打包，它们仍在 GitHub 上。</p>
       <a class="btnlink" href="${esc(bk.all_url)}" rel="noopener">下载全部（${size(bk.total_bytes)}）</a>`
    : `<p><b>每日自动备份</b>：每天 03:23 把每个 App 的程序和数据各打一个压缩包，保留 30 天。</p><p class="muted">第一次备份还没完成。</p>`;
  const localCnt = apps.filter(a => a.phone.kind === 'local').length;
  const order = {local:0, unknown:1, cloud:2, minor:3, none:4};
  const kindText = {local:'只在手机里', cloud:'已存 GitHub', none:'无需备份', minor:'影响不大', unknown:'未登记'};
  const cards = [...apps].sort((x, y) => RANK[x.B.state] - RANK[y.B.state] || order[x.phone.kind] - order[y.phone.kind]).map(a => {
    const B = a.B, b = B.latest, max = Math.max(...B.hist.map(h => h.bytes || 0), 1);
    const hist = B.hist.slice().reverse().map((h, i, arr) => `<i class="${i && arr[i - 1].sha === h.sha ? 'same' : ''}" style="height:${Math.max(15, (h.bytes || 0) / max * 100)}%" title="${esc(h.date)} ${size(h.bytes)}"></i>`).join('');
    const cloud = b && !b.error
      ? `<div class="dl"><span>${md(b.at)} ${hm(b.at)} · ${size(b.bytes)} · ${b.files} 个文件</span><a href="${esc(b.url)}" rel="noopener">下载</a></div>
         ${b.skipped ? `<div class="n" style="font-size:12px">跳过 ${b.skipped} 个大文件（${size(b.skipped_bytes)}）</div>` : ''}
         ${B.hist.length > 1 ? `<div class="dl"><div class="hist">${hist}</div><span class="n" style="font-size:12px">${B.changed ? '比上一份有变化' : '和上一份相同'} · 共 ${B.hist.length} 份</span></div>` : ''}`
      : `<div class="${b && b.error ? 'alert' : 'n'}">${esc(B.text)}</div>`;
    return `<article class="app ${B.state === 'ok' ? '' : B.state}">${head(a, `<span class="chip ${a.phone.kind}">${kindText[a.phone.kind] || '未登记'}</span>`)}
      <div class="body">
        <div class="box"><span class="lab">每日自动备份<em>程序＋GitHub 上的数据</em></span>${cloud}</div>
        <div class="box"><span class="lab">手机里的数据<em>${kindText[a.phone.kind] || ''}</em></span><div>${esc(a.phone.text)}</div>
          ${a.phone.kind === 'local' ? `<div><a href="${esc(a.url + (a.phone.path || ''))}" target="_blank" rel="noopener" style="font-weight:600;text-decoration:none">打开 ${esc(a.title)} 去备份</a></div>` : ''}</div>
      </div></article>`;
  }).join('');
  return `<section><h2>自动备份</h2><div class="panel">${intro}</div></section>
    <section><h2>各 App 备份情况<small>${localCnt} 个 App 有只在手机里的数据</small></h2>
    <div class="panel" style="margin-bottom:12px"><p class="muted">这 ${localCnt} 个 App 的记录存在你手机上，总控台读不到，也看不到它们上次备份的时间。换手机、清理 Safari 数据或删掉 App 前，记得在 App 里各备份一次。</p></div>
    <div class="list">${cards}</div></section>`;
}

/* 我的记录 */
const R = window.HubRecords;
let recState = {total: 0, apps: 0, last: 0}, recOpen = new Set(), recQuery = '', recMsg = '';
async function refreshRecState(){
  try { const all = await R.getAll(); let total = 0, last = 0;
    for (const r of all) { total += (await R.itemsOf(r)).length; last = Math.max(last, (r.imports[0] || {}).at || 0); }
    recState = {total, apps: all.length, last};
  } catch (e) {}
}
function recShell(){
  return `<section><h2>我的记录<small>只存在这台手机的总控台里</small></h2>
    <div class="panel"><p>Ease、Forge、Crosscheck、左右千年、领袖·政党这几个 App 的记录存在它们各自里面。先在 App 里导出备份文件，再在这里导入，就能在总控台里看、搜、导出。</p>
      <p class="muted">每次导入都会和之前导入的合在一起，重复的自动去掉。想攒全，就隔一段时间在 App 里导出一次再导入。</p>
      <div class="btns" style="margin-top:10px"><label class="btn pri" for="recfile">导入备份文件</label><input id="recfile" type="file" accept=".json,application/json" multiple hidden>
        <button class="btn" type="button" data-rx="all-md">全部导出成文字</button><button class="btn" type="button" data-rx="all-json">全部导出成备份文件</button></div>
      <div class="result" id="recmsg">${recMsg}</div></div></section>
    <section><div id="reclist"><div class="skeleton"></div></div></section>`;
}
async function renderRec(apps){
  const all = await R.getAll().catch(() => []);
  const byId = Object.fromEntries(all.map(r => [r.id, r]));
  const urlOf = id => { const a = apps.find(x => x.key === R.REPO[id]); return a ? a.url : `https://${OWNER}.github.io/${R.REPO[id]}/`; };
  const iconOf = id => { const a = apps.find(x => x.key === R.REPO[id]); return a && a.probe && a.probe.icon; };
  const q = recQuery.trim();
  const blocks = [];
  for (const id of R.ORDER) {
    const A = R.APPS[id], rec = byId[id], items = rec ? await R.itemsOf(rec) : [];
    const shown = q ? items.filter(it => (it.title + '\n' + it.text).includes(q)) : items;
    const open = recOpen.has(id) || !!q;
    const icon = iconOf(id);
    const head = `<div class="head" style="cursor:default"><span class="icon">${esc(A.name.slice(0, 1))}${icon ? `<img src="${esc(icon)}" alt="" onerror="this.remove()">` : ''}</span>
      <span class="title"><b>${esc(A.name)}</b><span>${rec ? `最近导入 ${clock(rec.imports[0].at)} · 共导入 ${rec.imports.length} 次` : '还没导入'}</span></span>
      <span class="pill ${rec ? 'ok' : 'idle'}">${rec ? items.length + ' 条' : '未导入'}</span></div>`;
    if (!rec) { blocks.push(`<article class="app">${head}<div class="body"><div class="box"><span class="lab">怎么导出</span><div>${esc(A.how)}，再回这里点「导入备份文件」。</div><div><a href="${esc(urlOf(id))}" target="_blank" rel="noopener" style="font-weight:600;text-decoration:none">打开 ${esc(A.name)}</a></div></div></div></article>`); continue; }
    const list = open ? shown : shown.slice(0, 3);
    let day = '', rows = '';
    for (const it of list) {
      const d = it.at ? R.ymd(it.at) : '未标日期';
      if (open && d !== day) { rows += `<li class="recday">${d}</li>`; day = d; }
      rows += `<li><span class="rt">${it.at ? `<span>${open ? R.hhmm(it.at) : md(it.at)}</span>` : ''}<b>${esc(it.title)}</b></span>${it.text ? `<span class="rx">${esc(it.text)}</span>` : ''}</li>`;
    }
    const range = items.length ? `记录从 ${R.ymd(items[items.length - 1].at || items[0].at)} 到 ${R.ymd(items[0].at)}` : '';
    blocks.push(`<article class="app">${head}<div class="body">
      ${range ? `<div class="n" style="font-size:12px">${range}${q ? ` · 搜到 ${shown.length} 条` : ''}</div>` : ''}
      ${list.length ? `<ul class="recs ${open ? '' : 'clamp'}">${rows}</ul>` : `<div class="n">${q ? '没有搜到' : '这次导入的文件里没有记录'}</div>`}
      ${!q && items.length > 3 ? `<button class="toggle" type="button" data-rt="${id}">${open ? '收起' : `查看全部 ${items.length} 条`} <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="${open ? 'transform:rotate(180deg)' : ''}"><path d="m6 9 6 6 6-6"/></svg></button>` : ''}
      <div class="btns"><button class="btn" type="button" data-rx="${id}-md">导出文字</button><button class="btn" type="button" data-rx="${id}-json">导出备份文件</button><a class="btn" href="${esc(urlOf(id))}" target="_blank" rel="noopener">打开 App</a></div>
      ${open && !q ? `<div class="n" style="font-size:12px">「备份文件」是 ${esc(A.name)} 自己的格式，合并了每次导入的记录，可以在 App 里用「恢复」导回去。</div><div><button class="toggle" type="button" data-rdel="${id}" style="color:var(--bad)">从总控台删掉这些记录</button></div>` : ''}
      </div></article>`);
  }
  const others = '<div class="panel" style="margin-top:12px"><p class="muted">其他 App：基金日记、生活雷达的记录存在 GitHub 上，每天自动备份，在「最近备份」里下载；五子棋、芽芽只存设置和进度，没有导出功能；Game On 没有个人记录。</p></div>';
  const el = $('#reclist'); if (!el) return;
  el.innerHTML = `${all.length ? '<input type="search" id="recq" placeholder="搜索所有导入的记录" value="' + esc(recQuery) + '" style="margin-bottom:12px">' : ''}<div class="list">${blocks.join('')}</div>${others}`;
  const qi = $('#recq'); if (qi && recQuery) { qi.focus(); qi.setSelectionRange(recQuery.length, recQuery.length); }
}
document.addEventListener('input', e => { if (e.target.id === 'recq') { recQuery = e.target.value; clearTimeout(window._rq); window._rq = setTimeout(() => data && renderRec(data.apps), 250); } });
document.addEventListener('change', async e => {
  if (e.target.id !== 'recfile') return;
  const files = [...e.target.files]; if (!files.length) return;
  const out = [];
  for (const f of files) out.push(...await R.importFile(f));
  recMsg = out.map(r => r.error ? `<div class="bad">${esc(r.file)}：${esc(r.error)}</div>` : `<div>${esc(r.app)}：新增 ${r.added} 条，更新 ${r.updated} 条</div>`).join('');
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (err) {}
  await refreshRecState(); render();
});
document.addEventListener('click', async e => {
  const x = e.target.closest('[data-rx]');
  if (x) { const [id, kind] = x.dataset.rx.split('-'); x.disabled = true; try { id === 'all' ? await R.exportAll(kind) : await R.exportOne(id, kind); } finally { x.disabled = false; } return; }
  const t = e.target.closest('[data-rt]');
  if (t) { const id = t.dataset.rt; recOpen.has(id) ? recOpen.delete(id) : recOpen.add(id); renderRec(data.apps); return; }
  const d = e.target.closest('[data-rdel]');
  if (d) {
    if (d.dataset.sure) { await R.del(d.dataset.rdel); recMsg = `<div>已从总控台删掉 ${esc(R.APPS[d.dataset.rdel].name)} 的记录（App 里的不受影响）</div>`; await refreshRecState(); render(); }
    else { d.dataset.sure = '1'; d.textContent = '再点一次确认删除（App 里的记录不受影响）'; }
  }
});

/* 全部 App 网址 */
const short = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
function renderDir(apps){
  const list = [...apps].sort((x, y) => (x.key === 'hub') - (y.key === 'hub'));
  $('#dirsec').innerHTML = `<h2>全部 App 网址<small>点名字打开 · 点「复制」发给别人</small></h2><div class="panel"><ul class="dir">${list.map(a => `<li>
    <span class="ic">${esc(a.title.slice(0, 1))}${a.probe && a.probe.icon ? `<img src="${esc(a.probe.icon)}" alt="" onerror="this.remove()">` : ''}</span>
    <span class="nm"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a><span>${esc(short(a.url))}</span></span>
    <button type="button" data-copy="${esc(a.url)}">复制</button></li>`).join('')}</ul></div>`;
}

/* ---------- 交互 ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    const done = () => { c.textContent = '已复制'; c.classList.add('done'); setTimeout(() => { c.textContent = '复制'; c.classList.remove('done'); }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling.lastElementChild); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); c.textContent = '已选中，长按复制'; };
    try { navigator.clipboard.writeText(c.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
    return;
  }
  const p = e.target.closest('[data-view]');
  if (p) { view = p.dataset.view; store.set('hub-view', view); render(); return; }
  const t = e.target.closest('[data-toggle]');
  if (t && view !== 'bak' && view !== 'rec') { const r = t.dataset.toggle; openSet.has(r) ? openSet.delete(r) : openSet.add(r); render(); }
});
$('#refresh').addEventListener('click', () => load(true));

refreshRecState().then(() => data && render());
const cached = store.get('hub-last');
if (cached && cached.st) { data = cached.st; render(); }
load(false);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (!fetchedAt || Date.now() - fetchedAt > 5 * 60000)) load(false); });
setInterval(() => { if (document.visibilityState === 'visible' && data) render(); }, 60000);
</script>
</body>
</html>
